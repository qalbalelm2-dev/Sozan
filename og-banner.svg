<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#312e81" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <linearGradient id="heartGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)" />

  <!-- Decorative Rings and Geometry -->
  <circle cx="1100" cy="100" r="280" fill="#4338ca" opacity="0.25" />
  <circle cx="100" cy="550" r="320" fill="#ec4899" opacity="0.15" />
  <circle cx="950" cy="450" r="180" fill="#fbbf24" opacity="0.1" />

  <!-- Main Card Container -->
  <g filter="url(#shadow)" transform="translate(80, 70)">
    <rect width="1040" height="490" rx="36" fill="#1e293b" fill-opacity="0.85" stroke="#3730a3" stroke-width="2" />

    <!-- Badge: 2027 Official Platform -->
    <rect x="660" y="50" width="320" height="46" rx="23" fill="url(#goldGrad)" />
    <text x="820" y="80" fill="#0f172a" font-family="'Cairo', 'Tajawal', sans-serif" font-size="20" font-weight="900" text-anchor="middle" direction="rtl">
      المنصة التعليمية الرسمية 2027
    </text>

    <!-- Logo and Heart Icon -->
    <g transform="translate(880, 160)">
      <circle cx="0" cy="0" r="54" fill="#4f46e5" />
      <!-- Heart Path -->
      <path d="M0 26 C-30 0 -44 -20 -44 -38 C-44 -52 -32 -62 -18 -62 C-8 -62 0 -54 0 -44 C0 -54 8 -62 18 -62 C32 -62 44 -52 44 -38 C44 -20 30 0 0 26 Z" fill="url(#heartGrad)" transform="translate(0, 18) scale(0.65)" />
    </g>

    <!-- Main Title -->
    <text x="800" y="180" fill="#ffffff" font-family="'Cairo', 'Tajawal', sans-serif" font-size="52" font-weight="900" text-anchor="end" direction="rtl">
      منصة قلب العلم التعليمية
    </text>

    <!-- Subtitle / Supervisor Credit -->
    <text x="800" y="240" fill="#fbbf24" font-family="'Cairo', 'Tajawal', sans-serif" font-size="30" font-weight="800" text-anchor="end" direction="rtl">
      إشراف وإدارة: حسام أحمد مساعد
    </text>

    <!-- Description Line -->
    <text x="980" y="310" fill="#cbd5e1" font-family="'Cairo', 'Tajawal', sans-serif" font-size="22" font-weight="600" text-anchor="end" direction="rtl">
      كورسات متخصصة • امتحانات مقالية واختيارية بالصور • تصحيح دقيق • مسابقات وتحديات كبرى
    </text>

    <!-- Badges Row -->
    <g transform="translate(80, 380)">
      <!-- Badge 1: Sequential System -->
      <rect x="680" y="0" width="220" height="50" rx="16" fill="#312e81" stroke="#4f46e5" stroke-width="1.5" />
      <text x="790" y="32" fill="#e0e7ff" font-family="'Cairo', 'Tajawal', sans-serif" font-size="18" font-weight="800" text-anchor="middle" direction="rtl">
        نظام تسلسلي مشروط
      </text>

      <!-- Badge 2: Competitions -->
      <rect x="420" y="0" width="230" height="50" rx="16" fill="#312e81" stroke="#4f46e5" stroke-width="1.5" />
      <text x="535" y="32" fill="#fde68a" font-family="'Cairo', 'Tajawal', sans-serif" font-size="18" font-weight="800" text-anchor="middle" direction="rtl">
        دوري مسابقات ولوحة شرف
      </text>

      <!-- Badge 3: Parent Portal -->
      <rect x="160" y="0" width="230" height="50" rx="16" fill="#312e81" stroke="#4f46e5" stroke-width="1.5" />
      <text x="275" y="32" fill="#a7f3d0" font-family="'Cairo', 'Tajawal', sans-serif" font-size="18" font-weight="800" text-anchor="middle" direction="rtl">
        تقرير تفصيلي لولي الأمر
      </text>
    </g>
  </g>
</svg>
